    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c11" id="sentinel-theme-color" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('app-theme') || localStorage.getItem('sentinel_theme');
          var isDark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var color = isDark ? '#0b0c11' : '#ffffff';
          var scheme = isDark ? 'dark' : 'light';
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-mode', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-mode', 'light');
          }
          document.documentElement.style.colorScheme = scheme;
          // Set background once to prevent white flash on load only — React/CSS will own this after mount
          document.documentElement.style.backgroundColor = color;
          document.querySelectorAll('meta[name="theme-color"]').forEach(function(m) {
            m.setAttribute('content', color);
          });
          // Clear the inline backgroundColor once React is ready so CSS classes are authoritative
          window.addEventListener('DOMContentLoaded', function() {
            requestAnimationFrame(function() {
              requestAnimationFrame(function() {
                document.documentElement.style.removeProperty('background-color');
                if (document.body) document.body.style.removeProperty('background-color');
              });
            });
          }, { once: true });
        } catch(e) {}
      })();
    </script>
